<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Pro — Aplikasi Point of Sale</title>
<link rel="icon" href="logo-kasir-pro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1B;
    --paper:#FBF8F2;
    --panel:#FFFFFF;
    --brand:#D42A26;
    --brand-dark:#A61F1C;
    --brand-light:#FDEBEA;
    --teal:#14555A;
    --teal-light:#E3EEEC;
    --chili:#C4432B;
    --chili-light:#FBE8E3;
    --line:#E4DFD3;
    --text:#22282E;
    --muted:#767065;
    --green:#3F7D4D;
    --green-light:#E5F1E6;
    --radius:12px;
    --shadow:0 4px 20px rgba(0,0,0,0.06);
    --shadow-hover:0 8px 32px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num,.brandText,button{font-family:'Space Grotesk',sans-serif;}
  button{cursor:pointer;font-family:inherit;}
  input,select,textarea{font-family:'Inter',sans-serif;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#D8D2C4;border-radius:3px;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--ink);
    background-image: radial-gradient(circle at 20% 20%, rgba(212,42,38,0.10), transparent 40%);
    padding:24px;
  }
  .loginCard{
    background:var(--paper);
    width:100%;max-width:400px;
    border-radius:20px;
    padding:40px 32px;
    box-shadow:0 24px 80px rgba(0,0,0,0.4);
    text-align:center;
  }
  .loginCard .logo{width:72px;height:72px;object-fit:contain;margin-bottom:8px;border-radius:50%;background:var(--brand);padding:12px;}
  .loginCard .brandText{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;}
  .loginCard .tagline{color:var(--muted);font-size:12px;letter-spacing:0.5px;margin:2px 0 28px;text-transform:uppercase;font-weight:600;}
  .field{margin-bottom:14px;text-align:left;}
  .roleTabs{display:flex;gap:8px;margin-bottom:18px;}
  .roleTab{
    flex:1;text-align:center;padding:10px 0;border-radius:10px;
    border:2px solid var(--line);background:var(--panel);
    font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;
  }
  .roleTab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);
    background:#fff;font-size:14px;color:var(--text);transition:border .2s;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--brand);}
  .btnPrimary{
    width:100%;padding:14px 0;border-radius:10px;border:none;
    background:var(--brand);color:#fff;font-weight:700;font-size:15px;
    margin-top:6px;transition:background .2s,transform .1s;
  }
  .btnPrimary:hover{background:var(--brand-dark);transform:scale(0.98);}
  .btnPrimary:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .loginHint{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.6;padding:14px 16px;background:var(--teal-light);border-radius:10px;text-align:left;}
  .loginError{color:var(--chili);font-size:12.5px;margin-top:8px;display:none;text-align:left;}
  .loginStatus{font-size:12px;color:var(--muted);margin-top:14px;}
  #registerFormView{display:none;}
  .authSwitch{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;}
  .authSwitch b{color:var(--brand);cursor:pointer;font-weight:700;}
  .authSwitch b:hover{text-decoration:underline;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;background:var(--ink);color:#fff;flex-shrink:0;
    display:flex;flex-direction:column;padding:24px 16px;
  }
  .sidebar .brandRow{display:flex;align-items:center;gap:10px;padding:0 8px 28px;}
  .sidebar .brandRow img{width:32px;height:32px;object-fit:contain;border-radius:8px;flex-shrink:0;}
  .sidebar .brandRow .brandText{color:#fff;font-size:18px;font-weight:700;letter-spacing:-0.3px;}
  .navItem{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
    color:#B9C0CA;font-size:13.5px;font-weight:500;margin-bottom:2px;
    border:none;background:none;width:100%;text-align:left;
    transition:all .2s;
  }
  .navItem:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .navItem.active{background:var(--brand);color:#fff;font-weight:700;}
  .navDot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.5;flex-shrink:0;}
  .navItem.active .navDot{opacity:1;background:#fff;}
  .sidebarFooter{margin-top:auto;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;}
  .userChip{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  .userAvatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .userChip .uname{font-size:13px;font-weight:600;color:#fff;}
  .userChip .urole{font-size:11px;color:#9AA3AF;}
  .logoutBtn{margin-top:10px;width:100%;padding:9px;border-radius:8px;background:rgba(255,255,255,0.06);border:none;color:#D7DBE0;font-size:12px;transition:all .2s;}
  .logoutBtn:hover{background:rgba(196,67,43,0.25);color:#fff;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);
  }
  .topbar h1{font-size:20px;margin:0;font-weight:600;}
  .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .content{padding:24px 32px;overflow-y:auto;flex:1;}

  .grid{display:grid;gap:16px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
    transition:box-shadow .2s,transform .2s;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
  .metric .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .metric .num{font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);}
  .metric.accent{border-left:4px solid var(--brand);}
  .metric.teal{border-left:4px solid var(--teal);}
  .metric.chili{border-left:4px solid var(--chili);}
  .metric.green{border-left:4px solid var(--green);}

  .sectionTitle{font-size:14px;font-weight:700;margin:0 0 14px;color:var(--ink);}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);}
  td{padding:12px 16px;border-bottom:1px solid #F0EDE4;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;}
  .badge.green{background:var(--green-light);color:var(--green);}
  .badge.chili{background:var(--chili-light);color:var(--chili);}
  .badge.gray{background:#EFECE4;color:var(--muted);}
  .badge.teal{background:var(--teal-light);color:var(--teal);}

  .btn{
    padding:9px 18px;border-radius:8px;border:2px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:600;color:var(--text);
    transition:all .2s;
  }
  .btn:hover{background:#F5F2EA;transform:scale(0.97);}
  .btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.dark:hover{background:#333;}
  .btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.brand:hover{background:var(--brand-dark);}
  .btn.chili{background:#fff;color:var(--chili);border-color:#EBC3B9;}
  .btn.chili:hover{background:var(--chili-light);}
  .btn.sm{padding:5px 12px;font-size:11.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  /* ---------- CATEGORY MODERN ---------- */
  .categoryGrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;
  }
  .categoryCard{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:16px;
    padding:24px 20px;
    text-align:center;
    transition:all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .categoryCard:hover{
    transform:translateY(-4px) scale(1.02);
    border-color:var(--brand);
    box-shadow:var(--shadow-hover);
  }
  .categoryCard .catIcon{
    font-size:36px;margin-bottom:8px;display:block;
  }
  .categoryCard .catName{
    font-weight:700;font-size:15px;color:var(--ink);
  }
  .categoryCard .catCount{
    font-size:12px;color:var(--muted);margin-top:4px;
  }
  .categoryCard .catDelete{
    position:absolute;top:8px;right:8px;
    width:28px;height:28px;border-radius:50%;border:none;
    background:rgba(196,67,43,0.1);color:var(--chili);
    font-size:14px;cursor:pointer;opacity:0;
    transition:opacity .2s;
  }
  .categoryCard:hover .catDelete{opacity:1;}
  .categoryCard .catDelete:hover{background:var(--chili-light);}

  .categoryAddCard{
    border:2px dashed var(--line);
    border-radius:16px;
    padding:24px 20px;
    text-align:center;
    transition:all .3s;
    cursor:pointer;
    background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:140px;
  }
  .categoryAddCard:hover{
    border-color:var(--brand);
    background:var(--brand-light);
  }
  .categoryAddCard .addIcon{
    font-size:32px;color:var(--brand);
  }
  .categoryAddCard .addLabel{
    font-weight:600;font-size:14px;color:var(--brand);
  }

  /* ---------- ATTENDANCE CAMERA ---------- */
  .cameraContainer{
    position:relative;border-radius:16px;overflow:hidden;background:#1a1a1a;
    width:100%;max-width:400px;aspect-ratio:3/4;margin:0 auto;
  }
  .cameraContainer video{
    width:100%;height:100%;object-fit:cover;
  }
  .cameraContainer .cameraOverlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.3);
    pointer-events:none;
  }
  .cameraContainer .cameraOverlay .frame{
    width:70%;height:70%;border:3px solid rgba(255,255,255,0.4);border-radius:20px;
    position:relative;
  }
  .cameraContainer .cameraOverlay .frame .corner{
    position:absolute;width:20px;height:20px;border-color:rgba(255,255,255,0.8);
    border-style:solid;border-width:0;
  }
  .cameraContainer .cameraOverlay .frame .corner.tl{top:-2px;left:-2px;border-top-width:4px;border-left-width:4px;border-radius:4px 0 0 0;}
  .cameraContainer .cameraOverlay .frame .corner.tr{top:-2px;right:-2px;border-top-width:4px;border-right-width:4px;border-radius:0 4px 0 0;}
  .cameraContainer .cameraOverlay .frame .corner.bl{bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px;border-radius:0 0 0 4px;}
  .cameraContainer .cameraOverlay .frame .corner.br{bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px;border-radius:0 0 4px 0;}
  .cameraActions{
    display:flex;gap:12px;justify-content:center;margin-top:16px;
  }
  .cameraActions .btn{
    padding:12px 24px;border-radius:50px;
  }
  .cameraActions .btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);}
  .cameraActions .btn.chili{background:var(--chili);color:#fff;border-color:var(--chili);}

  .selfiePreview{
    width:100%;max-width:200px;border-radius:16px;margin:0 auto;display:block;
    border:3px solid var(--brand);
  }

  /* ---------- KASIR / POS ---------- */
  .posLayout{display:grid;grid-template-columns:1fr 340px;gap:16px;height:100%;}
  .posFilters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{
    padding:8px 16px;border-radius:100px;border:2px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);
    transition:all .2s;
  }
  .chip:hover{background:var(--brand-light);border-color:var(--brand);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .searchBox{flex:1;min-width:160px;padding:10px 16px;border-radius:100px;border:2px solid var(--line);font-size:13px;transition:border .2s;}
  .searchBox:focus{outline:none;border-color:var(--brand);}
  .prodGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .prodCard{
    background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;
    text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;
    transition:all .2s;
  }
  .prodCard:hover:not(:disabled){border-color:var(--brand);transform:scale(0.98);}
  .prodCard .pname{font-size:13px;font-weight:700;color:var(--ink);}
  .prodCard .pcat{font-size:10.5px;color:var(--muted);}
  .prodCard .pprice{font-size:14px;font-weight:700;color:var(--teal);margin-top:4px;}
  .prodCard .pstock{font-size:10.5px;color:var(--muted);}
  .prodCard .pstock.low{color:var(--chili);font-weight:700;}
  .prodCard:disabled{opacity:0.4;cursor:not-allowed;}

  .receipt{
    background:#fff;border:2px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;height:fit-content;position:sticky;top:0;
    box-shadow:var(--shadow);
  }
  .receiptHead{padding:16px 18px;border-bottom:2px dashed var(--line);}
  .receiptHead .rtitle{font-size:14px;font-weight:700;}
  .receiptHead .rmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .cartList{padding:10px 18px;max-height:280px;overflow-y:auto;}
  .cartItem{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F2EFE7;gap:8px;}
  .cartItem:last-child{border-bottom:none;}
  .cartItem .ciname{font-size:12.5px;font-weight:600;}
  .cartItem .ciprice{font-size:11px;color:var(--muted);}
  .qtyBox{display:flex;align-items:center;gap:6px;}
  .qtyBox button{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:#fff;font-size:14px;line-height:1;padding:0;transition:all .2s;}
  .qtyBox button:hover{background:var(--brand-light);border-color:var(--brand);}
  .qtyBox span{font-size:13px;font-weight:700;min-width:16px;text-align:center;}
  .emptyCart{padding:40px 16px;text-align:center;color:var(--muted);font-size:12.5px;}
  .receiptTotals{padding:14px 18px;border-top:2px dashed var(--line);font-size:13px;}
  .totalRow{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);}
  .totalRow.grand{color:var(--ink);font-weight:700;font-size:17px;padding-top:10px;border-top:2px dashed var(--line);margin-top:6px;}
  .receiptActions{padding:14px 18px;display:flex;flex-direction:column;gap:8px;}

  .modalOverlay{position:fixed;inset:0;background:rgba(27,27,27,0.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(4px);}
  .modalOverlay.show{display:flex;}
  .modalBox{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
  .modalBox h3{margin:0 0 4px;font-size:18px;font-weight:700;}
  .modalBox .msub{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .modalClose{float:right;background:none;border:none;font-size:20px;color:var(--muted);padding:4px;transition:color .2s;}
  .modalClose:hover{color:var(--ink);}

  .lowStockBanner{background:var(--chili-light);border:2px solid #EBC3B9;color:#8A2E1B;border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(24px);
    background:var(--ink);color:#fff;padding:12px 24px;border-radius:100px;font-size:13px;font-weight:600;
    opacity:0;transition:all .3s;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,0.3);
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--chili);}

  .formRow{margin-bottom:14px;}
  .formRow label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .formRow input, .formRow select, .formRow textarea{
    width:100%;padding:10px 14px;border-radius:8px;border:2px solid var(--line);font-size:13px;transition:border .2s;
  }
  .formRow input:focus, .formRow select:focus, .formRow textarea:focus{outline:none;border-color:var(--brand);}
  .formRow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .tabsRow{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;}
  .tabBtn{padding:10px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s;}
  .tabBtn.active{color:var(--ink);border-bottom-color:var(--brand);}

  .payMethods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .payBtn{padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:700;text-align:center;transition:all .2s;}
  .payBtn:hover{border-color:var(--brand);}
  .payBtn.active{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark);}

  .barWrap{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .barLabel{width:90px;font-size:11.5px;color:var(--muted);flex-shrink:0;font-weight:500;}
  .barTrack{flex:1;height:8px;background:#F0EDE4;border-radius:4px;overflow:hidden;}
  .barFill{height:100%;background:var(--teal);border-radius:4px;transition:width .6s ease;}
  .barVal{width:70px;text-align:right;font-size:11.5px;font-weight:700;flex-shrink:0;}

  .loaderOverlay{position:fixed;inset:0;background:rgba(251,248,242,0.85);display:none;align-items:center;justify-content:center;z-index:200;font-size:13px;color:var(--muted);font-weight:600;backdrop-filter:blur(2px);}
  .loaderOverlay.show{display:flex;}

  .bottomNav{display:none;}
  .bnItem{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 0 6px;border:none;background:none;color:var(--muted);font-size:10.5px;font-weight:600;
    transition:color .2s;
  }
  .bnItem .bnIcon{font-size:18px;line-height:1;}
  .bnItem.active{color:var(--brand);}

  .attendanceCard{
    background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:20px;text-align:center;
    transition:all .3s;
  }
  .attendanceCard:hover{border-color:var(--brand);box-shadow:var(--shadow-hover);}

  .attendanceHistory{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;
  }
  .attendanceHistory .item{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;display:flex;align-items:center;gap:12px;
  }
  .attendanceHistory .item img{
    width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--brand);
  }
  .attendanceHistory .item .info{flex:1;}
  .attendanceHistory .item .info .name{font-weight:600;font-size:13px;}
  .attendanceHistory .item .info .time{font-size:11px;color:var(--muted);}

  @media(max-width:980px){
    .posLayout{grid-template-columns:1fr;}
    .g4{grid-template-columns:repeat(2,1fr);}
    .prodGrid{grid-template-columns:repeat(2,1fr);}
    .sidebar{width:76px;padding:16px 8px;}
    .sidebar .brandRow .brandText{display:none;}
    .navItem span.navLabel{display:none;}
    .userChip .uname,.userCh
